[project]
name = "supportops-ai"
version = "0.1.0"
description = "Evidence-backed enterprise support investigations with durable, approval-controlled actions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain-openai>=1,<2",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "tiktoken>=0.9,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "pyjwt[crypto]>=2.10,<3",
  "alembic>=1.15,<2",
]
[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=5.1,<6"]
guardrails = ["guardrails-ai>=0.7,<1"]
evals = [
    "langchain-community>=0.3.31,<0.4",
    "ragas>=0.4,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/supportops"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
